name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then unzip -o -q "$ZIP" -d proyecto; else mkdir -p proyecto && cp -r . proyecto/ 2>/dev/null || true; fi
          DIR=$(dirname "$(find proyecto -name settings.gradle | head -1)")
          echo "Proyecto en: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar
        run: cd "$PROJ" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
